name: Update arXiv archive

on:
  schedule:
    # 10:30 Beijing (02:30 UTC) and 18:30 Beijing (10:30 UTC)
    - cron: "30 2 * * 1-5"
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional archive date: YYYY-MM-DD"
        required: false
        type: string
      days:
        description: "Number of days to fetch ending at date (default: 4)"
        required: false
        default: "4"
        type: string
      translate_existing:
        description: "Translate existing papers that lack Chinese summary"
        required: false
        default: True
        type: boolean
      rebuild_index:
        description: "Rebuild index.json from local daily files (use after deleting a date)"
        required: false
        default: false
        type: boolean
      no_date_filter:
        description: "Fetch latest papers without submittedDate filter"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install deep-translator

      - name: Fetch arXiv papers
        run: |
          TRANSLATE="${{ github.event.inputs.translate_existing }}"
          REBUILD_INDEX="${{ github.event.inputs.rebuild_index }}"
          if [ "$TRANSLATE" = "true" ]; then
            python scripts/fetch_arxiv.py --translate-existing --timezone Asia/Shanghai
          elif [ "$REBUILD_INDEX" = "true" ]; then
            python scripts/fetch_arxiv.py --rebuild-index --timezone Asia/Shanghai
          else
            NO_DATE_FILTER="${{ github.event.inputs.no_date_filter }}"
            DAYS="${{ github.event.inputs.days }}"
            DATE="${{ github.event.inputs.date }}"
            ARGS="--timezone Asia/Shanghai --max-results 700"
            if [ -n "$DATE" ]; then
              ARGS="$ARGS --date $DATE"
            fi
            if [ -n "$DAYS" ]; then
              ARGS="$ARGS --days $DAYS"
            fi
            if [ "$NO_DATE_FILTER" = "true" ]; then
              ARGS="$ARGS --no-date-filter"
            fi
            python scripts/fetch_arxiv.py $ARGS
          fi

      - name: Commit archive updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/papers
          if git diff --cached --quiet; then
            echo "No archive changes."
          else
            git commit -m "Update arXiv archive"
            git push
          fi
